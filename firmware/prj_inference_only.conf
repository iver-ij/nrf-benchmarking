# =============================================================================
# Standalone constrained inference profile
# =============================================================================

# --- System ---
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_FPU=y
CONFIG_REGULATOR=y
CONFIG_ENTROPY_GENERATOR=y

# --- C++ / Libc ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

# --- Optimization ---
CONFIG_SPEED_OPTIMIZATIONS=y

# --- AI / DSP ---
CONFIG_CMSIS_NN=y
CONFIG_CMSIS_NN_ACTIVATION=y
CONFIG_CMSIS_NN_CONVOLUTION=y
CONFIG_CMSIS_NN_FULLYCONNECTED=y
CONFIG_CMSIS_NN_BASICMATH=y
CONFIG_CMSIS_NN_POOLING=y
CONFIG_CMSIS_NN_SOFTMAX=n
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_MATRIX=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y

# --- Memory / Runtime ---
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_INIT_STACKS=n

# --- Logging ---
CONFIG_LOG=n
CONFIG_LOG_PRINTK=n
