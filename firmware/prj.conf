# =============================================================================
# nRF7002DK embedded ML benchmark firmware with WiFi telemetry.
# =============================================================================

# --- System ---
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_FPU=y
CONFIG_REGULATOR=y

# --- C++ / Libc ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

# --- Optimization ---
CONFIG_SPEED_OPTIMIZATIONS=y

# --- AI / DSP ---
CONFIG_CMSIS_NN=y
CONFIG_CMSIS_NN_ACTIVATION=y
CONFIG_CMSIS_NN_CONVOLUTION=y
CONFIG_CMSIS_NN_FULLYCONNECTED=y
CONFIG_CMSIS_NN_BASICMATH=y
CONFIG_CMSIS_NN_POOLING=y
# Keep CMSIS-NN for core layers; leave Softmax on TFLM reference path
# to reduce cross-runtime 1-LSB parity drift in low-probability classes.
CONFIG_CMSIS_NN_SOFTMAX=n
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_MATRIX=y
# CONFIG_CMSIS_DSP_DISTANCE is not needed - we only use TRANSFORM (FFT)
CONFIG_CMSIS_DSP_COMPLEXMATH=y

# nRF5340 cpuapp has no Zephyr D-cache maintenance path; keep buffer alignment
# and explicit coherency hooks guarded in code for portable reuse.

# =============================================================================
# WiFi Configuration (from Nordic sta sample)
# =============================================================================
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NRF70_QSPI_LOW_POWER=n
CONFIG_NRF_WIFI_IF_AUTO_START=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_READY_LIB=y
CONFIG_NRF_WIFI_RPU_RECOVERY=y
CONFIG_WIFI_MGMT_EXT=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
# Placeholder credentials only. Override locally with:
#   -DEXTRA_CONF_FILE=firmware/prj.local.conf
# and define CONFIG_WIFI_CREDENTIALS_STATIC_SSID / PASSWORD there.
CONFIG_WIFI_CREDENTIALS_STATIC_SSID="YOUR_SSID"
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="YOUR_PASSWORD"

# =============================================================================
# Networking (from Nordic sta sample)
# =============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
# Use hotspot DHCP instead of a fixed LAN address
CONFIG_NET_DHCPV4=y
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NRF70_RX_NUM_BUFS=16
CONFIG_HEAP_MEM_POOL_SIZE=200000
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_CONTEXT_SYNC_RECV=y
CONFIG_INIT_STACKS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
# Hotspot deployments use DHCP-assigned IPv4 settings.
# Enable ARP
CONFIG_NET_ARP=y
CONFIG_NET_SOCKETS_POLL_MAX=10

# Disable IPv6 to save RAM
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n

# =============================================================================
# Memory (adjusted for AI + WiFi)
# =============================================================================
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

# =============================================================================
# Kernel / logging
# =============================================================================
CONFIG_ENTROPY_GENERATOR=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_POSIX_CLOCK=y
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
