# Quantized reference export overlay for deterministic UART capture.
# Keep runtime deterministic and avoid log buffering that can drop markers.
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_FPU=y
CONFIG_REGULATOR=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_MATRIX=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y

CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_LOG=n
CONFIG_LOG_PRINTK=n

# Strict quantized parity capture: use generic/reference TFLM kernels
# so firmware parity target matches Python TFLite reference behavior.
CONFIG_CMSIS_NN=n
