# Export-only overlay for deterministic C reference capture.
# Keep runtime close to normal firmware but avoid auto network init and
# increase main stack for benchmark/dump path.
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_FPU=y
CONFIG_REGULATOR=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_MATRIX=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y

CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_MAIN_STACK_SIZE=32768

# C-reference export must not drop UART lines (C_REF_BEGIN/C_REF_END).
# Route printk directly instead of deferred logging backend.
CONFIG_LOG=n
CONFIG_LOG_PRINTK=n
